[project]
name = "statementparser"
version = "0.1.0"
description = "Parse bank statement and categorize transactions."
authors = [
    {name = "Karel Harjono",email = "harjono.karel@gmail.com"}
]
license = "MIT"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "streamlit (>=1.56.0,<2.0.0)",
    "pandas (>=3.0.2,<4.0.0)",
    "pydantic (>=2.12.5,<3.0.0)",
    "sqlalchemy (>=2.0.48,<3.0.0)",
    "pdfplumber (>=0.11.9,<0.12.0)",
    "python-dateutil (>=2.9.0.post0,<3.0.0)",
    "rapidfuzz (>=3.14.3,<4.0.0)"
]


[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[dependency-groups]
dev = [
    "pytest (>=9.0.2,<10.0.0)",
    "pytest-cov (>=7.1.0,<8.0.0)",
    "pytest-xdist (>=3.8.0,<4.0.0)",
    "mypy (>=1.20.0,<2.0.0)",
    "ruff (>=0.15.8,<0.16.0)"
]
